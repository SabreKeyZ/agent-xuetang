name: ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test deps and projects
        run: |
          python -m pip install -U pip
          python -m pip install pytest
          python -m pip install -e "projects/ticketdesk"
          python -m pip install -e "projects/claimdesk"

      - name: Run offline tests
        env:
          OPENAI_API_KEY: ""
          GITHUB_TOKEN: ""
        # labs/ 学徒自跑（vibe-minidesk / vibe-miniclaim 空 stub 会红），不要加进默认 CI
        run: |
          python -m pytest -q \
            code/week1 \
            code/week2 \
            code/week3 \
            code/week4 \
            code/week5 \
            projects/ticketdesk/tests \
            projects/claimdesk/tests
