[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "miniclaim"
version = "0.0.0"
description = "雾津保迷你理赔台（学徒 vibe 作业，默认空实现）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SabreKeyZ" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
miniclaim = "miniclaim.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
