<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>青匣记 · 工单台 Inbox</title>
  <link rel="stylesheet" href="/static/ticketdesk.css" />
</head>
<body class="td-body">
  <div class="td-app">
    <aside class="td-inbox">
      <div class="td-brand">
        <div class="td-word">Agent学堂</div>
        <div class="td-rule">没有引用，就先不答</div>
        <div class="td-shop">青匣记 · Inbox</div>
      </div>
      <div class="td-filters" id="td-filters">
        <button class="td-pilltab td-pilltab-on" data-filter="all">全部</button>
        <button class="td-pilltab" data-filter="overdue">超时</button>
        <button class="td-pilltab" data-filter="todo">待你执行</button>
      </div>
      <div class="td-threads" id="td-threads"></div>
    </aside>

    <section class="td-stage">
      <header class="td-top">
        <div>
          <div class="td-subject" id="td-subject">选一条会话</div>
          <div class="td-context" id="td-context">左边 Inbox，中间气泡，回复钉在底部。</div>
        </div>
        <div class="td-do">
          <button class="td-ghost" id="td-reload">刷新队列</button>
        </div>
      </header>
      <div class="td-feed" id="td-feed">
        <div class="td-blank">从左侧打开一条顾客会话。这里是对话气泡，不是案件卡片，也没有支付表。</div>
      </div>
      <footer class="td-dock">
        <textarea class="td-box" id="td-box" placeholder="回复草稿会出现在这里。点「执行」只记审计，不会真退款。"></textarea>
        <div class="td-dockrow">
          <span class="td-note" id="td-note">闸门：执行只写审计，不打款。</span>
          <button class="td-go" id="td-go" disabled>执行</button>
        </div>
      </footer>
    </section>

    <aside class="td-side">
      <p class="td-side-label">订单事实</p>
      <div id="td-facts"><span class="td-note">选中会话后看单号、金额、SLA。</span></div>
      <div class="td-foot">浅色 Inbox · 白/灰气泡 · 不是青绿</div>
    </aside>
  </div>
  <script>
    const CHANNEL = { "在线客服": "IM", "邮件": "APP", "电话转写": "12315" };
    let cases = [];
    let active = null;
    let filter = "all";

    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
    }[c]));
    const ticketOf = (c) => c.ticket || {};
    const slaOf = (c) => c.sla || {};
    const ch = (c) => CHANNEL[ticketOf(c).channel] || ticketOf(c).channel || "";
    const lastLine = (c) => (ticketOf(c).body || "").replace(/\s+/g, " ").trim().slice(0, 48) || "（空）";
    const needsYou = (c) => ["wait_human_confirm", "draft_only"].includes(c.next_action)
      || ((c.gate || {}).verdict === "draft_ok");
    const overdue = (c) => Boolean(slaOf(c).breached);
    const visible = () => cases.filter((c) => {
      if (filter === "overdue") return overdue(c);
      if (filter === "todo") return needsYou(c);
      return true;
    });
    const clock = (c) => {
      const sla = slaOf(c);
      if (sla.breached) return "已超时";
      const m = sla.remaining_minutes ?? 0;
      const h = Math.floor(Math.max(m, 0) / 60);
      const mm = String(Math.max(m, 0) % 60).padStart(2, "0");
      return h + ":" + mm;
    };

    function renderList() {
      $("td-threads").innerHTML = visible().map((c) => {
        const t = ticketOf(c);
        const late = overdue(c);
        return `<div class="td-row ${active === c.case_id ? "td-row-on" : ""}" data-id="${esc(c.case_id)}">
          <div class="td-face">${esc((t.customer_name || "?").slice(0, 1))}</div>
          <div>
            <div><span class="td-who">${esc(t.customer_name || c.case_id)}</span>
              <span class="td-when">${esc((t.created_at || "").slice(11, 16))}</span></div>
            <div class="td-preview">${esc(lastLine(c))}</div>
            <div class="td-meta">
              <span class="td-chan">${esc(ch(c))}</span>
              <span class="td-sla ${late ? "td-sla-late" : ""}">${late ? "超时" : "SLA " + (slaOf(c).remaining_minutes ?? "?") + "m"}</span>
            </div>
          </div>
        </div>`;
      }).join("");
      $("td-threads").querySelectorAll(".td-row").forEach((el) => {
        el.addEventListener("click", () => openCase(el.dataset.id));
      });
    }

    function renderThread(c) {
      const t = ticketOf(c);
      $("td-subject").textContent = t.title || c.case_id;
      $("td-context").textContent = `${c.case_id} · ${t.customer_name || ""} · ${ch(c)}`;
      let html = `<div class="td-turn td-turn-guest">
        <div class="td-balloon">${esc(t.body)}</div>
        <div class="td-stamp">${esc(t.customer_name)} · ${esc(ch(c))} · ${esc((t.created_at || "").replace("T", " ").slice(0, 16))}</div>
      </div>`;
      if (c.banner && c.refused) {
        html += `<div class="td-turn td-turn-note"><div class="td-balloon">${esc(c.banner)}</div></div>`;
      }
      if (c.draft_reply) {
        const chips = (c.citations || []).map((x) =>
          `<button class="td-cite" type="button" data-ref="${esc(x)}">${esc(x)}</button>`
        ).join("");
        html += `<div class="td-turn td-turn-desk">
          <div class="td-balloon">${esc(c.draft_reply)}</div>
          ${chips ? `<div class="td-cites">${chips}</div>` : ""}
          <div class="td-quote" id="td-quote" hidden></div>
          <div class="td-stamp">客服草稿 · 闸门未打款</div>
        </div>`;
      } else if (!c.refused) {
        html += `<div class="td-blank">还没有客服回复。</div>`;
      }
      $("td-feed").innerHTML = html;
      $("td-feed").scrollTop = $("td-feed").scrollHeight;
      $("td-box").value = c.draft_reply || "";
      const canExec = !c.refused && ["wait_human_confirm", "draft_only"].includes(c.next_action);
      $("td-go").disabled = !canExec;
      $("td-note").textContent = `下一动：${c.next_action || "—"} · ${c.idempotency_key || ""}`;
      const sla = slaOf(c);
      $("td-facts").innerHTML = `
        <div class="td-fact"><span class="td-k">单号</span><span class="td-v">${esc(t.order_id || "—")}</span></div>
        <div class="td-fact"><span class="td-k">金额</span><span class="td-v">¥${esc(t.amount_yuan ?? "—")}</span></div>
        <div class="td-fact"><span class="td-k">SLA 倒计时</span>
          <div class="td-timer ${sla.breached ? "td-timer-late" : ""}">${clock(c)}</div></div>
        <div class="td-fact"><span class="td-k">优先级</span><span class="td-v">${esc(t.priority || sla.priority || "—")}</span></div>
        <div class="td-fact"><span class="td-k">夜班 L2</span><span class="td-v">${sla.l2_empty ? "空岗" : ((sla.l2 && sla.l2.name) || "在岗")}</span></div>`;
      $("td-feed").querySelectorAll(".td-cite").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const cite = await (await fetch("/api/cite?ref=" + encodeURIComponent(btn.dataset.ref))).json();
          const q = $("td-quote");
          if (!q) return;
          q.hidden = false;
          q.textContent = cite.ok ? cite.snippet : (cite.error || "打不开");
        });
      });
    }

    async function openCase(id) {
      active = id;
      renderList();
      const d = await (await fetch("/api/case/" + encodeURIComponent(id))).json();
      if (d.ok === false) return;
      const i = cases.findIndex((x) => x.case_id === id);
      if (i >= 0) cases[i] = d;
      renderList();
      renderThread(d);
      history.replaceState(null, "", "?case=" + encodeURIComponent(id));
    }

    async function boot() {
      cases = ((await (await fetch("/api/queue")).json()).cases) || [];
      renderList();
      const want = new URLSearchParams(location.search).get("case");
      const pick = cases.find((c) => c.case_id === want || ticketOf(c).fixture_id === want || ticketOf(c).id === want);
      if (pick) await openCase(pick.case_id);
      else if (cases[0]) await openCase(cases[0].case_id);
    }

    $("td-filters").addEventListener("click", (e) => {
      const t = e.target.closest(".td-pilltab");
      if (!t) return;
      filter = t.dataset.filter;
      $("td-filters").querySelectorAll(".td-pilltab").forEach((x) => x.classList.toggle("td-pilltab-on", x === t));
      renderList();
    });
    $("td-reload").addEventListener("click", boot);
    $("td-go").addEventListener("click", async () => {
      if (!active) return;
      const out = await (await fetch("/api/execute", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ case_id: active, confirm: true }),
      })).json();
      $("td-note").textContent = out.message || "未打款";
      await openCase(active);
    });
    boot();
  </script>
</body>
</html>
