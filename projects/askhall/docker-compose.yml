services:
  askhall:
    build:
      context: ../..
      dockerfile: projects/askhall/Dockerfile
    ports:
      - "8000:8000"
    environment:
      ASKHALL_DOCS: /app
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-chat}
