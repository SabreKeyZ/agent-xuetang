[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "issueforge"
version = "0.1.0"
description = "开源值班台：对 GitHub Issue 做分流、复现清单与双语回复"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SabreKeyZ" }]
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
issueforge = "issueforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
