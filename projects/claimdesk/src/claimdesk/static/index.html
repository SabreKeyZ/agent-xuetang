<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>青途保 · 理赔台</title>
  <link rel="stylesheet" href="/static/claimdesk.css" />
</head>
<body class="cd-body">
  <header class="cd-bar">
    <div class="cd-mark">理赔台 <em>Agent学堂 · 青途保</em></div>
    <p class="cd-law">没有引用，就先不答</p>
    <span class="cd-env" id="cd-env">检查中…</span>
  </header>

  <section class="cd-board" id="cd-board">
    <p class="cd-caption">Payments · 案件表。点一行打开卷宗。这里没有会话气泡。</p>
    <table class="cd-grid">
      <thead>
        <tr>
          <th>案件号</th>
          <th>险种</th>
          <th class="cd-num">金额</th>
          <th>状态机</th>
          <th>出险日</th>
        </tr>
      </thead>
      <tbody id="cd-rows"></tbody>
    </table>
  </section>

  <section class="cd-file" id="cd-file">
    <button class="cd-back" id="cd-back" type="button">← 支付表</button>
    <div class="cd-split">
      <div class="cd-main" id="cd-main"></div>
      <aside class="cd-col">
        <h2>核赔</h2>
        <button class="cd-act" id="cd-pass" type="button" disabled>通过</button>
        <button class="cd-act" id="cd-sup" type="button" disabled>补件</button>
        <button class="cd-act" id="cd-deny" type="button" disabled>拒赔</button>
        <button class="cd-cash" id="cd-cash" type="button" disabled>执行打款</button>
        <p class="cd-fine" id="cd-fine">无条款命中时整列锁定。演示不打款。</p>
      </aside>
    </div>
  </section>
  <div class="cd-toast" id="cd-toast" hidden></div>

  <script>
    let cases = [], active = null, selectedRec = "";
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"
    }[c]));
    const yuan = (n) => "¥" + Number(n || 0).toFixed(2);
    const product = (p) => p === "accident" ? "意外险" : "运费险";
    const recClass = (r) => ({ "通过": "cd-st-ok", "补件": "cd-st-hold", "拒赔": "cd-st-no", "拒审": "cd-st-no", "差额": "cd-st-ok", "复议": "cd-st-hold" }[r] || "");
    const statusOf = (c) => c.case_status || (c.decision || {}).case_status || (c.decision || {}).recommendation || "立案";
    const role = (r) => ({ docs_check: "材料质检", clause: "条款员", adjudicator: "核赔员", store: "账本", human: "同事" }[r] || r);
    const showToast = (text) => {
      const el = $("cd-toast");
      el.hidden = false;
      el.textContent = text;
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => { el.hidden = true; }, 4200);
    };
    const canPay = (rec, cites) => Boolean(cites && cites.length) && ["通过", "差额"].includes(rec);

    function showBoard() {
      $("cd-board").style.display = "block";
      $("cd-file").classList.remove("cd-file-on");
      active = null;
      history.replaceState(null, "", location.pathname);
      renderRows();
    }

    function showFile() {
      $("cd-board").style.display = "none";
      $("cd-file").classList.add("cd-file-on");
    }

    function renderRows() {
      $("cd-rows").innerHTML = cases.map((c) => {
        const cl = c.claim || {};
        const rec = (c.decision || {}).recommendation || "待审";
        const st = statusOf(c);
        return `<tr class="cd-tr" data-case="${esc(c.case_id)}">
          <td data-case="${esc(c.case_id)}">${esc(cl.id || c.case_id)}</td>
          <td data-case="${esc(c.case_id)}">${esc(product(cl.product))}</td>
          <td class="cd-num" data-case="${esc(c.case_id)}">${yuan(cl.amount_yuan)}</td>
          <td data-case="${esc(c.case_id)}"><span class="cd-st ${recClass(rec)}">${esc(st)}</span></td>
          <td data-case="${esc(c.case_id)}">${esc((cl.incident_at || "").slice(0, 10))}</td>
        </tr>`;
      }).join("");
    }

    function paintActs(d) {
      const cites = (d && d.citations) || [];
      const locked = cites.length === 0;
      const rec = selectedRec || (d && d.decision && d.decision.recommendation) || "";
      const map = { "通过": "cd-pass", "差额": "cd-pass", "补件": "cd-sup", "拒赔": "cd-deny", "复议": "cd-sup" };
      ["cd-pass", "cd-sup", "cd-deny"].forEach((bid) => {
        const b = $(bid);
        b.disabled = locked;
        b.classList.toggle("cd-act-on", !locked && map[rec] === bid);
      });
      $("cd-cash").disabled = !canPay(rec, cites);
    }

    async function openCase(id) {
      active = id;
      showFile();
      const d = await (await fetch("/api/case/" + encodeURIComponent(id))).json();
      if (d.ok === false) return;
      const i = cases.findIndex((x) => x.case_id === id);
      if (i >= 0) cases[i] = d;
      const cl = d.claim || {};
      const rec = (d.decision || {}).recommendation || "";
      const cites = d.citations || [];
      const tags = cites.map((x) => `<button class="cd-tag" type="button" data-ref="${esc(x)}">${esc(x)}</button>`).join("");
      const thumbs = (cl.attachments || []).map((a) => {
        const name = a.name || a.file_id || "文件";
        const kind = a.kind || a.file_id || "";
        return `<div class="cd-thumb"><div class="cd-thumb-mark">${esc(String(name).slice(0, 1))}</div>${esc(name)}<br>${esc(kind)}</div>`;
      }).join("");
      const log = (d.audit || []).map((a) =>
        `<li class="cd-logitem"><b>${esc(role(a.role))}</b> · ${esc(a.detail || a.action)}</li>`
      ).join("");
      const math = d.settlement || {};
      $("cd-main").innerHTML = `
        <div class="cd-yen">${yuan(math.suggested_yuan != null ? math.suggested_yuan : cl.amount_yuan)}</div>
        <div class="cd-sub">${esc(cl.id)} · ${esc(cl.policy_no)} · 出险 ${esc((cl.incident_at || "").slice(0, 10))} · <span class="cd-st ${recClass(rec)}">${esc(statusOf(d))}</span> · ${esc(rec || "待审")} · ${esc(d.policy_version || "—")}</div>
        ${math.formula ? `<div class="cd-math">试算 ${esc(math.formula)}</div>` : ""}
        <div class="cd-tags">${tags || `<span class="cd-fine">无条款标签</span>`}</div>
        ${d.banner ? `<div class="cd-alert">${esc(d.banner)}</div>` : ""}
        <ol class="cd-log">${log}</ol>
        ${d.draft_reply ? `<div class="cd-letter">${esc(d.draft_reply)}</div>` : ""}
        <div class="cd-thumbs">${thumbs || `<span class="cd-fine">无证据缩略图</span>`}</div>
        <pre class="cd-snip" id="cd-snip"></pre>`;
      selectedRec = rec;
      paintActs(d);
      $("cd-fine").textContent = cites.length === 0
        ? "没有引用，就先不答。核赔列已锁定。"
        : (canPay(rec, cites)
          ? "建议通过。打款须人点执行，演示不打款。"
          : "建议已写出。通过案才能点打款；演示仍不打款。");
      $("cd-main").querySelectorAll(".cd-tag").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const cite = await (await fetch("/api/cite?ref=" + encodeURIComponent(btn.dataset.ref))).json();
          const snip = $("cd-snip");
          snip.classList.add("cd-snip-on");
          snip.textContent = cite.ok ? cite.snippet : (cite.error || "打不开");
        });
      });
      history.replaceState(null, "", "?case=" + encodeURIComponent(id));
    }

    async function boot() {
      try {
        const h = await (await fetch("/api/health")).json();
        $("cd-env").textContent = h.llm ? "模型已开" : "抽取式 · 无 Key";
      } catch { $("cd-env").textContent = "后端未连接"; }
      cases = ((await (await fetch("/api/queue")).json()).cases) || [];
      renderRows();
      const want = new URLSearchParams(location.search).get("case");
      const pick = cases.find((c) => c.case_id === want || (c.claim || {}).fixture_id === want || (c.claim || {}).id === want);
      if (want && pick) await openCase(pick.case_id);
      else showBoard();
    }

    $("cd-rows").addEventListener("click", (e) => {
      const hit = e.target.closest("[data-case]");
      if (!hit) return;
      openCase(hit.getAttribute("data-case"));
    });
    $("cd-back").addEventListener("click", showBoard);
    const pickRec = { "cd-pass": "通过", "cd-sup": "补件", "cd-deny": "拒赔" };
    ["cd-pass", "cd-sup", "cd-deny"].forEach((bid) => {
      $(bid).addEventListener("click", () => {
        if ($(bid).disabled || !active) return;
        selectedRec = pickRec[bid];
        const row = cases.find((c) => c.case_id === active) || {};
        paintActs({ citations: row.citations || [], decision: { recommendation: selectedRec } });
        $("cd-fine").textContent = canPay(selectedRec, row.citations || [])
          ? "已改选通过。打款须人点执行，演示不打款。"
          : "已记下核赔选择。演示不打款。";
      });
    });
    $("cd-cash").addEventListener("click", async () => {
      if (!active || $("cd-cash").disabled) return;
      const out = await (await fetch("/api/execute", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ case_id: active, confirm: true }),
      })).json();
      const msg = out.message || "演示模式不打款，已记审计。";
      $("cd-fine").textContent = msg;
      showToast(msg);
    });
    boot();
  </script>
</body>
</html>
