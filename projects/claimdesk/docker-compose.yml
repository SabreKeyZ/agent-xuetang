services:
  claimdesk:
    build:
      context: ../..
      dockerfile: projects/claimdesk/Dockerfile
    ports:
      - "8001:8001"
    environment:
      CLAIMDESK_ROOT: /app/projects/claimdesk
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.deepseek.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-deepseek-chat}
